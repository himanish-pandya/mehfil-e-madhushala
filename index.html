<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madhushala</title>

  <!-- Favicon / Website Icon -->
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 20px;
    }

    .controls {
      margin-bottom: 20px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      padding: 8px;
      width: 300px;
      max-width: 100%;
    }

    #song-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .song-block {
      border: 1px solid #ccc;
      padding: 14px;
      background: #f9f9f9;
      cursor: grab;
    }

    .song-block.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    .song-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    /* Ready for future author image support */
    .author-image {
      width: 48px;
      height: 48px;
      border: 1px solid #ccc;
      object-fit: cover;
      display: none;
    }

    .author-image.placeholder {
      display: inline-block;
      background: #eee;
    }

    .song-title {
      margin: 0;
      font-size: 20px;
    }

    .author-name {
      margin: 2px 0 0 0;
    }

    .song-block p {
      margin: 6px 0;
    }

    .song-block ul {
      margin: 6px 0 0 20px;
    }

    .hidden {
      display: none;
    }

    button {
      padding: 8px 12px;
      margin-left: 8px;
      cursor: pointer;
    }

    a {
      color: blue;
    }

    .status {
      margin: 12px 0;
      color: green;
    }
  </style>
</head>
<body>
  <h1>Madhushala</h1>

  <div class="controls">
    <input
      type="text"
      id="searchInput"
      placeholder="Search by song name, author, or video..."
    />
    <div class="button-group">
      <button id="saveOrderBtn">Save Current Order</button>
      <button id="resetOrderBtn">Reset Saved Order</button>
    </div>
  </div>

  <div class="status" id="statusMessage"></div>

  <div id="song-list"></div>

  <script>
    /*
      ============================
      GOOGLE SHEETS CSV INTEGRATION
      ============================

      Replace the URL below with your Google Sheets published CSV link.

      Example format:
      https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/export?format=csv&gid=0
    */
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbnNyapXiol3pR0XY5Bd_3Mv65aSFGr5sDW46C3mjklCb7gg8Z8-KVphb1qOm9S0rG7yXpg-BvTE2r/pub?gid=0&single=true&output=csv";

    const STORAGE_KEY = "savedSongOrder";
    const songList = document.getElementById("song-list");
    const searchInput = document.getElementById("searchInput");
    const saveOrderBtn = document.getElementById("saveOrderBtn");
    const resetOrderBtn = document.getElementById("resetOrderBtn");
    const statusMessage = document.getElementById("statusMessage");

    let draggedItem = null;

    /*
      ============================
      EXPECTED CSV COLUMNS
      ============================

      Recommended sheet columns:

      id,song_name,author_name,rekhta_link,author_image,youtube_1,youtube_2,youtube_3,youtube_4

      Example row:
      1,Aaj Jaane Ki Zid Na Karo,Fayyaz Hashmi,https://www.rekhta.org,https://example.com/image.jpg,https://youtube.com/...,https://youtube.com/...,,

      Notes:
      - author_image is optional for now
      - Empty YouTube fields will not be shown
      - Add more youtube_N columns if needed
    */

    function showStatus(message) {
      statusMessage.textContent = message;
      setTimeout(() => {
        statusMessage.textContent = "";
      }, 2000);
    }

    function normalizeText(value) {
      return (value || "").toString().trim();
    }

    function getYouTubeFields(row) {
  return Object.keys(row)
    .filter((key) => /^youtube_\d+$/i.test(key))
    .map((key) => {
      const url = normalizeText(row[key]);
      if (!url) return null;

      const number = key.match(/\d+/)[0];
      const labelKey = `youtube_label_${number}`;
      const label = normalizeText(row[labelKey]) || `Video ${number}`;

      return { url, label };
    })
    .filter(Boolean);
}

function createYouTubeList(links) {
  if (!links.length) return null;

  const wrapper = document.createElement("div");
  const label = document.createElement("p");
  label.innerHTML = "<strong>YouTube Videos:</strong>";
  wrapper.appendChild(label);

  const list = document.createElement("ul");

  links.forEach((entry) => {
    const item = document.createElement("li");
    const anchor = document.createElement("a");
    anchor.href = entry.url;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    anchor.textContent = entry.label;
    item.appendChild(anchor);
    list.appendChild(item);
  });

  wrapper.appendChild(list);
  return wrapper;
}

    function createSongBlock(row, fallbackIndex) {
      const id = normalizeText(row.id) || `song-${fallbackIndex}`;
      const songName = normalizeText(row.song_name);
      const authorName = normalizeText(row.author_name);
      const rekhtaLink = normalizeText(row.rekhta_link);
      const authorImage = normalizeText(row.author_image);
      const youtubeLinks = getYouTubeFields(row);

      const youtubeLabelsText = youtubeLinks.map(item => item.label).join(" ").toLowerCase();

      const block = document.createElement("div");
      block.className = "song-block";
      block.draggable = true;
      block.dataset.id = id;
      block.dataset.song = songName.toLowerCase();
      block.dataset.author = authorName.toLowerCase();
      block.dataset.youtube = youtubeLabelsText;

      const header = document.createElement("div");
      header.className = "song-header";

      /*
        Author image support:
        - If author_image exists, it will show the image
        - If empty, a placeholder box remains for future enhancement
      */
      const img = document.createElement("img");
      img.className = "author-image";
      img.alt = `${authorName} picture`;

      if (authorImage) {
        img.src = authorImage;
        img.style.display = "inline-block";
      } else {
        img.classList.add("placeholder");
      }

      const textContainer = document.createElement("div");

      const title = document.createElement("h2");
      title.className = "song-title";
      title.textContent = songName || "Untitled Song";

      const author = document.createElement("p");
      author.className = "author-name";
      author.innerHTML = `<strong>Author:</strong> ${authorName || "Unknown"}`;

      textContainer.appendChild(title);
      textContainer.appendChild(author);

      header.appendChild(img);
      header.appendChild(textContainer);
      block.appendChild(header);

      if (rekhtaLink) {
        const rekhta = document.createElement("p");
        rekhta.innerHTML = `<strong>Rekhta Link:</strong> <a href="${rekhtaLink}" target="_blank" rel="noopener noreferrer">View on Rekhta</a>`;
        block.appendChild(rekhta);
      }

      const youtubeSection = createYouTubeList(youtubeLinks);
      if (youtubeSection) {
        block.appendChild(youtubeSection);
      }

      return block;
    }

    function attachDragEventsToBlock(block) {
      block.addEventListener("dragstart", (event) => {
        draggedItem = event.currentTarget;
        draggedItem.classList.add("dragging");
      });

      block.addEventListener("dragend", (event) => {
        event.currentTarget.classList.remove("dragging");
        draggedItem = null;
      });

      block.addEventListener("dragover", (event) => {
        event.preventDefault();
      });

      block.addEventListener("drop", (event) => {
        event.preventDefault();
        const targetBlock = event.currentTarget;

        if (!draggedItem || draggedItem === targetBlock) return;

        const blocks = [...songList.querySelectorAll(".song-block")];
        const draggedIndex = blocks.indexOf(draggedItem);
        const targetIndex = blocks.indexOf(targetBlock);

        if (draggedIndex < targetIndex) {
          songList.insertBefore(draggedItem, targetBlock.nextSibling);
        } else {
          songList.insertBefore(draggedItem, targetBlock);
        }
      });
    }

    function saveOrder() {
      const order = [...songList.querySelectorAll(".song-block")].map(
        (block) => block.dataset.id
      );
      localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
      showStatus("Song order saved.");
    }

    function applySavedOrder() {
      const savedOrder = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!savedOrder || !Array.isArray(savedOrder)) return;

      savedOrder.forEach((id) => {
        const block = songList.querySelector(`.song-block[data-id="${id}"]`);
        if (block) {
          songList.appendChild(block);
        }
      });
    }

    function resetSavedOrder() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function filterSongs() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const blocks = songList.querySelectorAll(".song-block");

      blocks.forEach((block) => {
        const songName = block.dataset.song || "";
        const authorName = block.dataset.author || "";
        const youtubeLabels = block.dataset.youtube || "";

        const matches =
          songName.includes(searchTerm) || authorName.includes(searchTerm) || youtubeLabels.includes(searchTerm);

        block.classList.toggle("hidden", !matches);
      });
    }

    function renderSongs(data) {
      songList.innerHTML = "";

      data.forEach((row, index) => {
        const block = createSongBlock(row, index + 1);
        attachDragEventsToBlock(block);
        songList.appendChild(block);
      });

      applySavedOrder();
    }

    function loadCSVData() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function (results) {
          renderSongs(results.data);
        },
        error: function (error) {
          songList.innerHTML = "<p>Failed to load CSV data.</p>";
          console.error("CSV loading error:", error);
        }
      });
    }

    searchInput.addEventListener("input", filterSongs);
    saveOrderBtn.addEventListener("click", saveOrder);
    resetOrderBtn.addEventListener("click", resetSavedOrder);

    loadCSVData();
  </script>
</body>
</html>
